<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — L'Odience</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,700&family=Bebas+Neue&family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-900: #080810;
      --green-800: #10101e;
      --green-700: #18182e;
      --green-500: #6b21a8;
      --green-400: #9333ea;
      --green-300: #c084fc;
      --green-200: #ddb6fe;
      --cream:     #f3f0ff;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--green-900);
      color: var(--cream);
      overflow: hidden;
    }

    /* blob déco */
    .blob {
      position: fixed;
      top: -15%;
      right: -10%;
      width: 60vw;
      height: 80vh;
      background: linear-gradient(135deg, var(--green-500) 0%, var(--green-300) 60%);
      border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
      animation: blobMorph 10s ease-in-out infinite alternate;
      opacity: 0.18;
      pointer-events: none;
    }
    @keyframes blobMorph {
      0%   { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
      50%  { border-radius: 40% 60% 55% 45% / 50% 60% 40% 50%; }
      100% { border-radius: 55% 45% 40% 60% / 35% 65% 35% 65%; }
    }

    /* nav */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      padding: 0 48px;
      height: 68px;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(107,33,168,0.2);
      z-index: 10;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Playfair Display', serif !important;
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--cream);
      text-decoration: none;
    }
    .nav-logo img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
    .nav-logo em { color: var(--green-300); font-style: normal; margin-left: -2px; }

    /* contenu centré */
    .container {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      position: relative;
      z-index: 2;
    }

    .code-404 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(6rem, 20vw, 14rem);
      line-height: 1;
      color: var(--green-500);
      opacity: 0.35;
      letter-spacing: 0.08em;
      margin-bottom: -24px;
    }

    .titre {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.6rem, 4vw, 2.8rem);
      font-weight: 900;
      font-style: italic;
      color: var(--cream);
      margin-bottom: 20px;
      line-height: 1.2;
    }

    .sous-titre {
      font-size: 1rem;
      font-weight: 300;
      color: var(--green-200);
      line-height: 1.7;
      max-width: 420px;
      margin-bottom: 40px;
    }

    .btn-home {
      background: var(--green-400);
      color: var(--cream);
      padding: 14px 36px;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border-radius: 2px;
      text-decoration: none;
      transition: background 0.2s, transform 0.15s;
      display: inline-block;
    }
    .btn-home:hover { background: var(--green-300); transform: translateY(-2px); }

    @media (max-width: 480px) {
      nav { padding: 0 24px; }
      .code-404 { font-size: 8rem; }
    }
  </style>
</head>
<body>

<div class="blob"></div>

<nav>
  <a href="index.html" class="nav-logo">
    <img src="logo.webp" alt="Logo L'Odience" />
    L'<em>Odience</em>
  </a>
</nav>

<div class="container">
  <div class="code-404">404</div>
  <h1 class="titre">Tout doux le loup,<br>on finit bientôt ce côté du site.</h1>
  <p class="sous-titre">La page que tu cherches n'existe pas encore — ou elle a disparu dans le cyberspace.<br>Reviens sur tes pas.</p>
  <a href="index.html" class="btn-home">← Retour à l'accueil</a>
</div>

</body>
</html>
